name: Verify Webflow connection
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
    steps:
      - name: Check secret configuration
        run: |
          if [ -z "$WEBFLOW_API_TOKEN" ]; then
            echo "::error::WEBFLOW_API_TOKEN secret is missing"
            exit 1
          fi
      - name: Verify Webflow API access without logging credentials
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 2 --header "Authorization: Bearer $WEBFLOW_API_TOKEN" --header "Accept: application/json" https://api.webflow.com/v2/sites)
          if [ "$status" != "200" ]; then
            echo "::error::Webflow sites endpoint returned HTTP $status"
            exit 1
          fi
          echo "Webflow API connection verified (HTTP 200)."
