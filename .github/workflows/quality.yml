name: Studio CMS quality checks
on:
  push:
    branches: ['phase-*', 'fix/integrate-shared-renderer-main', 'feature/renderer-hardening-20261021', main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/studio_cms?schema=public
      STUDIO_ADMIN_PASSWORD: ci-only-placeholder
      STUDIO_SESSION_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run test:cloudflare-env
      - run: node --test scripts/test-public-renderer.cjs
      - run: npm run typecheck
      - run: npm run build
